    args:
      fromX: 0.5
      fromY: 0.88
      toX: 0.5
      toY: 0.68
      durationMs: 300
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: list-jump
executionPrerequisite: Expo light-list sheet open at half height with 2,000
